version: '3.8'

# Generalist Autonomous Agent Orchestration Platform
# Local development environment with Temporal, Redis, PostgreSQL, GraphSub

services:
  # PostgreSQL: Database for Temporal and persistent state
  postgres:
    image: postgres:15-alpine
    container_name: dsco-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dsco-network

  # Temporal Server: Durable workflow execution engine
  temporal:
    image: temporalio/auto-setup:latest
    container_name: dsco-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig.yaml
      TEMPORAL_METRICS_PROMETHEUS_FRAMEWORK_NAME: temporal
      LOG_LEVEL: info
    ports:
      - "7233:7233"  # gRPC
      - "6933:6933"  # Frontend
      - "6934:6934"  # History
      - "6935:6935"  # Matching
      - "6939:6939"  # Worker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6933/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dsco-network

  # Temporal UI: Web interface for monitoring workflows
  temporal-ui:
    image: temporalio/ui:latest
    container_name: dsco-temporal-ui
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dsco-network

  # Redis: High-performance in-memory store for mailbox and cache
  # CRITICAL: appendfsync always ensures writes are durable before acknowledge
  # Per Jepsen analysis, lazy fsync (default "everysec") can lose data on power failure
  redis:
    image: redis:7-alpine
    container_name: dsco-redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync always
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dsco-network

  # Redis Commander: Web UI for Redis inspection (development only)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: dsco-redis-commander
    depends_on:
      - redis
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - dsco-network

  # GraphSub: Stigmergic graph database for agent state and coordination
  # Note: GraphSub must be built and run separately. This is a placeholder.
  # To run GraphSub locally:
  #   cd /Users/arthurcolle/parallel_research_v2/graphsub
  #   cargo build --release
  #   ./target/release/graphsub start --http 0.0.0.0:12345 --shard-count 32
  # Then uncomment the section below and adjust as needed.
  #
  # graphsub:
  #   image: graphsub:latest
  #   container_name: dsco-graphsub
  #   ports:
  #     - "12345:12345"  # HTTP API
  #     - "54545:54545"  # Python MCP Server
  #   environment:
  #     GRAPHSUB_LOG: info
  #     SHARD_COUNT: "32"
  #     MEMORY_MAX: "4GB"
  #   volumes:
  #     - graphsub_data:/var/lib/graphsub
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:12345/health"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - dsco-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  graphsub_data:
    driver: local

networks:
  dsco-network:
    driver: bridge

# Service endpoints:
# Temporal gRPC:       localhost:7233
# Temporal HTTP:       localhost:6933
# Temporal UI:         http://localhost:8080
# Redis:               localhost:6379 (appendfsync: always)
# Redis Commander:     http://localhost:8081
# PostgreSQL:          localhost:5432 (user: temporal, password: temporal)
# GraphSub HTTP API:   http://localhost:7879
# GraphSub Cypher:     http://localhost:7879/cypher
# GraphSub GraphQL:    http://localhost:7879/graphql
# GraphSub REST:       http://localhost:7879/api/v1/...
#
# Note: GraphSub runs separately (not in docker-compose)
# See: /Users/arthurcolle/parallel_research_v2/graphsub
