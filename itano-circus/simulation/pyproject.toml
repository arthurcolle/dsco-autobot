[project]
name = "gen0-factory-simulation"
version = "0.3.0"
description = "Auditable discrete-event and robotics-validation backend for the A.COLLE factory universe"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "mujoco>=3.3,<4",
  "simpy>=4.1,<5",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
gen0-sim = "simulation.server:main"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
