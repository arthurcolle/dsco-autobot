version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: completions:latest
    container_name: completions-test
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload