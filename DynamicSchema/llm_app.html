<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Tree Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        #tree-container {
            width: 100%;
            height: 600px;
            border: 1px solid #ccc;
            overflow: auto;
        }
    </style>
</head>
<body>
    <input type="text" id="prompt-input" placeholder="Enter your prompt">
    <button onclick="sendPrompt()">Generate</button>
    <div id="tree-container"></div>

    <script>
        const ws = new WebSocket("ws://localhost:9987/ws");
        let treeData = {id: "root", name: "Root", children: []};
        let currentNode = treeData;

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            if (data.type === "content") {
                currentNode.name += data.data;
                updateTree();
            } else if (data.type === "logprobs") {
                const logprobs = data.data;
                if (!currentNode.children) {
                    currentNode.children = [];
                }
                currentNode.children.push({
                    id: Math.random().toString(36).substr(2, 9),
                    name: logprobs.token,
                    logprob: logprobs.logprob,
                    children: logprobs.top_logprobs.map(lp => ({
                        id: Math.random().toString(36).substr(2, 9),
                        name: lp.token,
                        logprob: lp.logprob,
                        children: []
                    }))
                });
                updateTree();
            }
        };

        function sendPrompt() {
            const prompt = document.getElementById("prompt-input").value;
            ws.send(JSON.stringify({prompt: prompt}));
            treeData = {id: "root", name: "Root", children: []};
            currentNode = treeData;
            updateTree();
        }

        function updateTree() {
            const width = 800;
            const height = 600;

            d3.select("#tree-container").selectAll("*").remove();

            const svg = d3.select("#tree-container")
                .append("svg")
                .attr("width", width)
                .attr("height", height);

            const g = svg.append("g")
                .attr("transform", `translate(${width / 2},${height / 2})`);

            const tree = d3.tree().size([2 * Math.PI, Math.min(width, height) / 2 - 100]);
            const root = d3.hierarchy(treeData);
            tree(root);

            const link = g.selectAll(".link")
                .data(root.links())
                .enter().append("path")
                .attr("class", "link")
                .attr("d", d3.linkRadial()
                    .angle(d => d.x)
                    .radius(d => d.y));

            const node = g.selectAll(".node")
                .data(root.descendants())
                .enter().append("g")
                .attr("class", "node")
                .attr("transform", d => `rotate(${d.x * 180 / Math.PI - 90}) translate(${d.y},0)`);

            node.append("circle")
                .attr("r", 4);

            node.append("text")
                .attr("dy", ".31em")
                .attr("x", d => d.x < Math.PI === !d.children ? 6 : -6)
                .attr("text-anchor", d => d.x < Math.PI === !d.children ? "start" : "end")
                .attr("transform", d => d.x >= Math.PI ? "rotate(180)" : null)
                .text(d => `${d.data.name} (${d.data.logprob ? d.data.logprob.toFixed(2) : ''})`);

            node.on("click", function(event, d) {
                if (d.children) {
                    currentNode = d.data;
                    ws.send(JSON.stringify({prompt: d.data.name}));
                }
            });
        }
    </script>
</body>
</html>
